version: '3.8'

services:
  vps-manager-bot:
    build: .
    container_name: vps-manager-pro-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME}
      - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD}
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./config_local.py:/app/config.py
    networks:
      - vps-manager-network

networks:
  vps-manager-network:
    driver: bridge
