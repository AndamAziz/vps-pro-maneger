---
- name: Deploy VPS Manager Pro
  hosts: vps_servers
  become: yes
  
  vars:
    repo_url: "https://github.com/AndamAziz/vps-pro-maneger.git"
    install_dir: "/opt/vps-manager"
    
  tasks:
    - name: Update system
      apt:
        update_cache: yes
        upgrade: yes
        
    - name: Install dependencies
      apt:
        name:
          - python3
          - python3-pip
          - git
          - curl
        state: present
        
    - name: Clone repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ install_dir }}"
        version: main
        
    - name: Run installer
      shell: bash {{ install_dir }}/vps-manager-installer.sh
      args:
        creates: /usr/local/bin/vpsbot
        
    - name: Start bot service
      systemd:
        name: vpsmanager-bot
        state: started
        enabled: yes
