name: Tests and Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', 3.11]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint pytest
    
    - name: Lint with pylint
      run: |
        pylint bot.py config.py handlers/*.py --disable=C0111,C0103 || true
    
    - name: Check code style
      run: |
        pip install black
        black --check . || true
    
    - name: Security check
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Verify installer script
      run: |
        chmod +x vps-manager-installer.sh
        bash -n vps-manager-installer.sh
        echo "✓ Installer script syntax is valid"
    
    - name: Check file structure
      run: |
        test -f README.md || exit 1
        test -f LICENSE || exit 1
        test -f requirements.txt || exit 1
        test -f bot.py || exit 1
        test -d handlers || exit 1
        echo "✓ All required files present"
