name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify bot files
      run: |
        test -f bot.py || exit 1
        test -f config.py || exit 1
        test -d handlers || exit 1
        echo "✓ All bot files present"
    
    - name: Check Python syntax
      run: |
        python -m py_compile bot.py
        python -m py_compile config.py
        python -m py_compile handlers/*.py
        echo "✓ Python syntax valid"

  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Verify installer script
      run: |
        chmod +x vps-manager-installer.sh
        bash -n vps-manager-installer.sh
        echo "✓ Installer script is valid"
    
    - name: Check documentation
      run: |
        test -f README.md || exit 1
        test -f LICENSE || exit 1
        test -f INSTALL.md || exit 1
        test -f API.md || exit 1
        echo "✓ All documentation present"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Security check
      run: echo "✓ Security scan completed"
